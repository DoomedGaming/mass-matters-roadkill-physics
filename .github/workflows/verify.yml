name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lua and image tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 imagemagick zip unzip
      - name: Verify source and build release package
        run: ./scripts/package-release.sh
