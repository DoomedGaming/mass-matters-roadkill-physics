name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lua and image tools
        timeout-minutes: 5
        run: |
          # Use Ubuntu's registered Kernel.org mirror when canonical hosts fail DNS.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://mirrors.kernel.org/ubuntu/\tpriority:1\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y lua5.4 imagemagick zip unzip
      - name: Verify source and build release package
        run: ./scripts/package-release.sh
